name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - test
      - preprod
      - main
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deploy SSH fingerprint guards
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -m unittest discover -s scripts -p 'test_deploy_ssh_fingerprint.py' -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify notification pagination API contract
        run: node scripts/notification-pagination-api-smoke.mjs
